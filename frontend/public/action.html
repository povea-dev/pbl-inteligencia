<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña - PBL Classroom</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f3f4f6 0%, #fee2e2 50%, #f3f4f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      padding: 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #fee2e2 0%, #f3f4f6 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      border: 2px solid #fecaca;
      box-shadow: 0 8px 16px rgba(220, 38, 38, 0.1);
    }

    .icon svg {
      width: 40px;
      height: 40px;
      color: #dc2626;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f4f6;
      border-top-color: #dc2626;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      background: #fee2e2;
      border: 2px solid #fecaca;
      border-radius: 12px;
      padding: 16px;
      color: #991b1b;
      margin-top: 24px;
    }

    .error-title {
      font-weight: 600;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
    </div>
    <h1>Restableciendo contraseña</h1>
    <p>Redirigiendo a la aplicación...</p>
    <div class="spinner"></div>
    <div id="error" class="error" style="display: none;">
      <div class="error-title">Error</div>
      <div id="error-message"></div>
    </div>
  </div>

  <script>
    // Obtener los parámetros de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const oobCode = urlParams.get('oobCode');
    const apiKey = urlParams.get('apiKey');
    const continueUrl = urlParams.get('continueUrl');
    const lang = urlParams.get('lang') || 'es';

    // Si tenemos los parámetros necesarios, redirigir a la aplicación
    if (mode && oobCode) {
      // Construir la URL de la aplicación con los parámetros
      let appUrl;
      if (continueUrl) {
        // Si hay continueUrl, agregar los parámetros a esa URL
        const url = new URL(continueUrl);
        url.searchParams.set('mode', mode);
        url.searchParams.set('oobCode', oobCode);
        appUrl = url.toString();
      } else {
        // Si no hay continueUrl, usar la URL por defecto
        appUrl = `${window.location.origin}/login?mode=${encodeURIComponent(mode)}&oobCode=${encodeURIComponent(oobCode)}`;
      }
      
      // Redirigir después de un breve delay para mostrar el mensaje
      setTimeout(() => {
        window.location.href = appUrl;
      }, 800);
    } else {
      // Si no hay parámetros válidos, mostrar error
      document.getElementById('error').style.display = 'block';
      document.getElementById('error-message').textContent = 'El link de restablecimiento es inválido o ha expirado.';
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('p').textContent = 'No se pudo procesar la solicitud.';
    }
  </script>
</body>
</html>
